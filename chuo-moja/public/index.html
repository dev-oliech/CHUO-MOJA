<meta charset="utf-8">
<title>Chuo Moja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: one shared "compound". Night-green hero band with a shuka-check edge, role colour re-themes the whole app, bottom tabs on phones, side rail on laptops. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --surface2:#E8EEE6; --ink:#0E1B14; --ink2:#425448; --line:#D2DCD2;
  --night:#0F2A1E; --night-ink:#EAF6EE; --night-dim:#9CBBA9;
  --green:#0A6B47; --green-soft:#D9EEE3;
  --gold:#A35F00; --gold-soft:#FBEDCF;
  --blue:#1D5FBF; --blue-soft:#E0EBFA;
  --red:#C41E3A; --red-soft:#FBE3E7;
  --live:#D9263F;
  --accent:var(--green); --accent-soft:var(--green-soft); --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(14,27,20,.06),0 6px 20px rgba(14,27,20,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A130E; --surface:#13211A; --surface2:#1B2D23; --ink:#E8F1EA; --ink2:#9DB1A3; --line:#26392D;
    --night:#0F2A1E; --night-ink:#EAF6EE; --night-dim:#9CBBA9;
    --green:#3DCB8E; --green-soft:#16382A;
    --gold:#F2B84B; --gold-soft:#3A2E12;
    --blue:#7FB0FF; --blue-soft:#172A47;
    --red:#FF7088; --red-soft:#3A1822;
    --live:#FF5A70; --on-accent:#08130D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A130E; --surface:#13211A; --surface2:#1B2D23; --ink:#E8F1EA; --ink2:#9DB1A3; --line:#26392D;
  --night:#0F2A1E; --night-ink:#EAF6EE; --night-dim:#9CBBA9;
  --green:#3DCB8E; --green-soft:#16382A;
  --gold:#F2B84B; --gold-soft:#3A2E12;
  --blue:#7FB0FF; --blue-soft:#172A47;
  --red:#FF7088; --red-soft:#3A1822;
  --live:#FF5A70; --on-accent:#08130D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root[data-role="lecturer"]{--accent:var(--gold);--accent-soft:var(--gold-soft)}
:root[data-role="staff"]{--accent:var(--blue);--accent-soft:var(--blue-soft)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shuka-check edge: Maasai shuka reds with black and white lines */
.shuka{height:8px;background:
  linear-gradient(90deg,transparent 0 12px,#111 12px 14px,transparent 14px 18px,#fff 18px 19px,transparent 19px 34px,#111 34px 35px,transparent 35px 40px),
  linear-gradient(0deg,transparent 0 2px,#111 2px 3px,transparent 3px 5px,#fff 5px 6px,transparent 6px),
  #C41E3A;background-size:40px 8px,40px 8px,auto}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top__in{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--ink2);line-height:1.1;white-space:nowrap}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.chip-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.chip-btn:hover{border-color:var(--accent)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:7px 10px;font-weight:700;font-size:12px;color:var(--ink2)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--ink2);font-size:11.5px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.main{padding:16px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;margin:0 auto;min-width:0}

@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr);max-width:1400px;margin:0 auto}
  .top{grid-column:1 / -1}
  .nav{position:sticky;top:64px;align-self:start;height:fit-content;grid-template-columns:1fr;border:0;background:none;padding:20px 12px;gap:4px;margin-top:8px}
  .nav button{flex-direction:row;gap:12px;padding:11px 14px;font-size:14.5px;justify-content:flex-start}
  .main{padding-bottom:60px}
}

/* generic bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card--flat{border-radius:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row--wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 0 10px}
.sec-h h2{font-size:20px}
.sec-h span{font-size:13px;color:var(--ink2)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;line-height:1.2;min-height:40px}
.btn:hover{filter:brightness(1.07)}
.btn--ghost{background:transparent;color:var(--accent)}
.btn--ghost:hover{background:var(--accent-soft);filter:none}
.btn--sm{padding:6px 12px;font-size:13px;min-height:34px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.badge--student{background:var(--green-soft);color:var(--green)}
.badge--lecturer{background:var(--gold-soft);color:var(--gold)}
.badge--staff{background:var(--blue-soft);color:var(--blue)}
.badge--live{background:var(--red-soft);color:var(--live)}
.badge--live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.badge--live::before{animation:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;font-family:var(--f-display)}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.note{border-radius:12px;padding:10px 12px;background:var(--gold-soft);color:var(--ink);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note--info{background:var(--accent-soft)}
.note button{margin-left:auto;border:0;background:none;color:var(--ink2);font-size:18px;line-height:1;padding:0 4px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px}
.search input{border:0;background:none;padding:11px 0;flex:1;min-width:0;outline:none}
.search:focus-within{border-color:var(--accent)}
.empty{padding:26px 16px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:14px}

/* hero */
.hero{background:var(--night);color:var(--night-ink);border-radius:20px;overflow:hidden;margin-bottom:16px}
.hero__in{padding:20px 18px 18px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(26px,5.5vw,40px);font-weight:800;letter-spacing:-.025em}
.hero p{color:var(--night-dim);max-width:60ch}
.hero .eyebrow{color:var(--night-dim)}
.hero__act{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.hero .btn{background:var(--night-ink);color:#0F2A1E;border-color:var(--night-ink)}
.hero .btn--ghost{background:transparent;color:var(--night-ink);border-color:rgba(234,246,238,.4)}
.hero .btn--ghost:hover{background:rgba(234,246,238,.1)}

.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);grid-template-areas:"side" "main"}
.cols__main{grid-area:main;min-width:0;display:flex;flex-direction:column;gap:18px}
.cols__side{grid-area:side;min-width:0;display:flex;flex-direction:column;gap:18px}
@media (min-width:1020px){
  .cols{grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"main side";align-items:start}
  .cols__side{position:sticky;top:76px}
}

/* map */
.map{position:relative}
.map svg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.map .land{fill:var(--surface2);stroke:var(--ink2);stroke-width:1.2;stroke-linejoin:round}
.map .lake{fill:var(--blue-soft);stroke:var(--blue);stroke-width:.8}
.map .pin{cursor:pointer}
.map .pin circle.core{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.map .pin circle.halo{fill:var(--accent);opacity:.18}
.map .pin:hover circle.halo,.map .pin[aria-pressed="true"] circle.halo{opacity:.4}
.map .pin[aria-pressed="true"] circle.core{fill:var(--live)}
.map text{font-family:var(--f-body);font-size:15px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface2);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:9px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2);line-height:1.2;display:block}

/* lists */
.item{display:flex;gap:12px;align-items:flex-start;min-width:0}
.item h3{font-size:16.5px;margin-bottom:2px}
.item p{font-size:14px;color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.post{display:flex;flex-direction:column;gap:10px}
.post__txt{font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.post__foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.composer{display:flex;flex-direction:column;gap:10px}
.composer textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-height:70px;width:100%;resize:vertical}

.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0;padding-top:0}
.when{flex:none;width:64px;text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);padding:6px 4px;line-height:1.15}
.when b{display:block;font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.when span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}

.match{background:var(--night);color:var(--night-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.match .muted{color:var(--night-dim)}
.match .btn{background:var(--night-ink);color:#0F2A1E;border-color:var(--night-ink)}
.match .btn--ghost{background:none;color:var(--night-ink);border-color:rgba(234,246,238,.4)}
.pulse{width:64px;height:64px;border-radius:50%;background:var(--accent);opacity:.8;animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(61,203,142,.5)}100%{box-shadow:0 0 0 26px rgba(61,203,142,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;text-align:center;line-height:1.2}
.week button b{display:block;font-family:var(--f-display);font-size:18px}
.week button span{font-size:11px;color:var(--ink2);text-transform:uppercase;font-weight:700}
.week button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.week button[aria-pressed="true"] span{color:var(--on-accent)}
.week i{display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:3px auto 0}
.week button[aria-pressed="true"] i{background:var(--on-accent)}

.switch{display:flex;align-items:center;gap:10px}
.switch button{width:46px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch button[aria-checked="true"]{background:var(--accent)}
.switch button[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-weight:500;color:var(--ink2);font-size:11.5px}
.seg button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 5px}
details.thread{border-top:1px solid var(--line);padding:10px 0}
details.thread:first-of-type{border-top:0}
details.thread summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
details.thread summary::-webkit-details-marker{display:none}
details.thread p{margin:8px 0 0 48px;font-size:14px;color:var(--ink2)}
.rules li{margin:6px 0}
.rules{padding-left:18px;margin:8px 0 0}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(6,14,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.sheet__h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet__h h2{font-size:22px}
.x{border:0;background:var(--surface2);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;text-align:center}
@media (min-width:900px){.toast{bottom:28px}}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;display:inline-flex;gap:6px;align-items:center}
.foot{margin-top:26px;font-size:12.5px;color:var(--ink2);text-align:center}

@media (max-width:560px){.brand small{display:none}.top__in{gap:8px}}

/* Phase 2: live rooms */
.room-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.room-grid{grid-template-columns:minmax(0,380px) minmax(0,1fr)}}
.chatlog{height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 11px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg .meta{font-size:11.5px}
.sys{align-self:center;font-size:12.5px;color:var(--ink2);text-align:center}
.chatin{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px}
.chatin:focus{outline:2px solid var(--accent)}

/* ===== Phase 3 ===== */
.badge--ver{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.map .pin.act circle.core{fill:var(--live)}
.map .pin.act circle.halo{fill:var(--live);opacity:.25}
.map--full svg{max-width:560px}
.q-ans{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin:6px 0}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.entry{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.entry b{font-family:var(--f-display);font-size:18px;display:block}
.entry small{color:var(--ink2);font-size:13px}
.mod-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.mod-row:first-child{border-top:0}
</style>
<div class="app">
  <header class="top">
    <div class="shuka"></div>
    <div class="top__in">
      <div class="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#0F2A1E"/><path d="M6 15Q17 3 28 15" fill="none" stroke="#EAF6EE" stroke-width="2.4" stroke-linecap="round"/><circle cx="10" cy="23" r="3" fill="#3DCB8E"/><circle cx="17" cy="23" r="3" fill="#F2B84B"/><circle cx="24" cy="23" r="3" fill="#7FB0FF"/></svg><div><b>Chuo Moja</b><small>One university across Kenya</small></div></div>
      <button class="chip-btn" id="role-btn" aria-haspopup="dialog" aria-label="Change role"></button>
      <div class="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">EN</button><button data-l="sw" aria-pressed="false">SW</button></div>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <main class="main" id="view"></main>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* Chuo Moja browser shim: gives the app the same db / user / room calls it used on the prototype page,
   backed by this server, and shows the email-code sign-in screen. */
(function(){
  'use strict';
  window.__SELFHOST=true;
  const HDR={'X-Requested-With':'chuo','Content-Type':'application/json'};
  let ME=null,readyRes;const ready=new Promise(r=>readyRes=r);
  const PEER=Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,6);
  const ERR=(r,j)=>{const e=new Error(j&&j.error||('HTTP '+r.status));e.status=r.status;e.code=r.status===401?'unauthenticated':(r.status===403||r.status===404)?'invalid_argument':'unavailable';return e};
  async function api(method,url,body){
    const r=await fetch(url,{method,headers:HDR,credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body)});
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok){if(r.status===401&&ME){ME=null;showLogin()}throw ERR(r,j)}
    return j;
  }

  /* ---------- sign-in screen ---------- */
  const css=`#login[hidden]{display:none}#login{position:fixed;inset:0;z-index:100;background:var(--bg,#F2F5F0);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top)) 16px 24px}
  #login .box{width:100%;max-width:440px;background:var(--surface,#fff);border:1px solid var(--line,#D2DCD2);border-radius:20px;padding:24px;margin-top:6vh;color:var(--ink,#0E1B14)}
  #login h1{font-family:var(--f-display,inherit);font-size:28px;margin:12px 0 6px;line-height:1.15}#login p{color:var(--ink2,#425448);font-size:14.5px;margin:0 0 14px}
  #login label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 4px}#login input{width:100%;border:1px solid var(--line,#D2DCD2);background:var(--surface,#fff);color:var(--ink,#0E1B14);border-radius:12px;padding:12px;font:inherit;font-size:16px}
  #login input.code{letter-spacing:.35em;font-family:var(--f-mono,monospace);font-size:22px;text-align:center}
  #login .btn{margin-top:16px;width:100%}#login .err{color:var(--live,#D9263F);font-size:13.5px;min-height:20px;margin-top:10px}#login .fine{font-size:12.5px;color:var(--ink2,#425448);margin-top:14px}
  #login .lnk{background:none;border:0;color:var(--accent,#0A6B47);font:inherit;font-weight:700;cursor:pointer;padding:6px 0;margin-top:6px}`;
  let loginEl=null,stepEmail='';
  function showLogin(){
    if(!loginEl){const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);loginEl=document.createElement('div');loginEl.id='login';loginEl.setAttribute('role','dialog');loginEl.setAttribute('aria-modal','true');loginEl.setAttribute('aria-label','Sign in');document.body.appendChild(loginEl)}
    loginEl.hidden=false;stepOne();
  }
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function box(inner){loginEl.innerHTML=`<div class="box"><svg width="40" height="40" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="#0F2A1E"/><path d="M6 15Q17 3 28 15" fill="none" stroke="#EAF6EE" stroke-width="2.4" stroke-linecap="round"/><circle cx="10" cy="23" r="3" fill="#3DCB8E"/><circle cx="17" cy="23" r="3" fill="#F2B84B"/><circle cx="24" cy="23" r="3" fill="#7FB0FF"/></svg>${inner}</div>`}
  function stepOne(msg){
    box(`<h1>Welcome to Chuo Moja</h1><p>One campus across Kenya. Sign in with your university email and we send you a 6-digit code. No password to remember.</p>
    <form id="lf1"><label for="le">University email</label><input id="le" type="email" inputmode="email" autocomplete="email" required placeholder="you@students.uonbi.ac.ke" value="${esc(stepEmail)}">
    <button class="btn" type="submit">Send me a code</button><div class="err" role="alert" id="lerr">${esc(msg||'')}</div></form>
    <p class="fine">Your email is only used to confirm you study or work at a Kenyan university. Other people never see it. <a href="/privacy.html" target="_blank" rel="noopener">How we handle your data</a>.</p>`);
    const f=loginEl.querySelector('#lf1'),i=loginEl.querySelector('#le');i.focus();
    f.onsubmit=async e=>{e.preventDefault();stepEmail=i.value.trim().toLowerCase();const b=f.querySelector('button');b.disabled=true;b.textContent='Sending…';
      try{await api('POST','/api/auth/request',{email:stepEmail});stepTwo()}catch(x){b.disabled=false;b.textContent='Send me a code';loginEl.querySelector('#lerr').textContent=x.message}};
  }
  function stepTwo(msg){
    box(`<h1>Check your inbox</h1><p>We sent a 6-digit code to <b>${esc(stepEmail)}</b>. It works for 10 minutes. Check spam if you do not see it.</p>
    <form id="lf2"><label for="lc">6-digit code</label><input id="lc" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    <label for="ln">Your name (shown to others, needed the first time)</label><input id="ln" autocomplete="name" maxlength="60" placeholder="e.g. Wanjiru Kamau">
    <button class="btn" type="submit">Sign in</button><div class="err" role="alert" id="lerr">${esc(msg||'')}</div></form>
    <button class="lnk" id="lback" type="button">Use a different email</button>`);
    const f=loginEl.querySelector('#lf2');loginEl.querySelector('#lc').focus();
    loginEl.querySelector('#lback').onclick=()=>stepOne();
    f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;
      try{const j=await api('POST','/api/auth/verify',{email:stepEmail,code:loginEl.querySelector('#lc').value,name:loginEl.querySelector('#ln').value});signedIn(j.me)}
      catch(x){b.disabled=false;loginEl.querySelector('#lerr').textContent=x.message==='name'?'Please add your name (at least 2 letters)':x.message}};
  }
  function signedIn(me){ME=me;if(loginEl)loginEl.hidden=true;startStream();readyRes()}

  /* ---------- live stream ---------- */
  let es=null,connected=false,streamOk;const streamReady=new Promise(r=>streamOk=r);
  const subs={},rooms={},connH=new Set();
  function startStream(){
    if(es)es.close();
    es=new EventSource('/api/stream?peer='+PEER);
    es.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.t==='hello'){connected=true;streamOk();connH.forEach(h=>h(true));Object.values(rooms).forEach(r=>r._rejoin());Object.keys(subs).forEach(c=>refetch(c))}
      else if(m.t==='db')refetch(m.col);
      else if(m.t==='peers'&&rooms[m.room])rooms[m.room]._peers(m);
      else if(m.t==='evt'&&rooms[m.room])rooms[m.room]._evt(m)};
    es.onerror=()=>{connected=false;connH.forEach(h=>h(false))};
  }
  const timers={};
  function refetch(col){
    const cols=col==='*'?Object.keys(subs):[col];
    cols.forEach(c=>{clearTimeout(timers[c]);timers[c]=setTimeout(()=>(subs[c]||[]).forEach(s=>s.fetch()),120)});
  }

  /* ---------- db ---------- */
  const snap=docs=>{const d=docs.map(x=>({id:x.id,data:()=>x.data}));return{docs:d,size:d.length}};
  const dbNs={collection(col){
    let lim=100;
    const c={orderBy(){return c},limit(n){lim=n;return c},
      onSnapshot(next,err){const s={fetch:async()=>{try{const j=await api('GET',`/api/db/${col}?limit=${lim}`);next(snap(j.docs))}catch(e){if(err)err(e)}}};(subs[col]=subs[col]||new Set()).add(s);s.fetch();return()=>{subs[col]&&subs[col].delete(s)}},
      async add(data){const j=await api('POST',`/api/db/${col}`,{data});return{id:j.id}},
      doc(id){const u=`/api/db/${col}/${encodeURIComponent(id)}`;
        return{async set(data){await api('PUT',u,{data})},async update(p){await api('PATCH',u,{data:p})},async delete(){await api('DELETE',u)},
          async get(){try{const j=await api('GET',u);return{id,exists:true,data:()=>j.doc.data}}catch(e){return{id,exists:false,data:()=>undefined}}},
          onSnapshot(next,err){const s={fetch:async()=>{try{const j=await api('GET',u);next({id,exists:true,data:()=>j.doc.data})}catch(e){if(e.status===404||e.status===403)next({id,exists:false,data:()=>undefined});else if(err)err(e)}}};(subs[col]=subs[col]||new Set()).add(s);s.fetch();return()=>{subs[col]&&subs[col].delete(s)}}}}};
    return c}};

  /* ---------- user ---------- */
  const userNs={async me(){return{id:ME.id,name:ME.name,avatarUrl:'',uniShort:ME.uni||''}},async id(){return ME.id},async can(){return true},async canEdit(){return !!ME.admin},async isOwner(){return !!ME.admin},
    async profiles(ids){const j=await api('GET','/api/profiles?ids='+encodeURIComponent(ids.join(',')));return j.profiles||{}}};

  /* ---------- rooms ---------- */
  function makeRoom(name){
    let mine={},others=[],skew=0;const hs={},ph=new Set(),dead={v:false};
    const room={name,_dead:false,
      peers(){return[{peer:PEER,by:ME.id,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:{...mine},updatedAt:Date.now()},...others]},
      _notify(){const p=room.peers();ph.forEach(h=>{try{h({peers:p,joined:[],left:[],updated:[]})}catch(e){}})},
      _peers(m){skew=Date.now()-m.serverNow;others=m.peers.filter(p=>p.peer!==PEER).map(p=>({peer:p.peer,by:p.by,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:p.presence||{},updatedAt:p.updatedAt+skew}));room._notify()},
      _evt(m){(hs[m.topic]||[]).forEach(h=>{try{h({topic:m.topic,data:m.data,peer:m.peer,by:m.by,isMe:m.peer===PEER,sameTab:m.peer===PEER,kind:'viewer',guest:false})}catch(e){}})},
      async _rejoin(){if(room._dead)return;try{await api('POST','/api/room/join',{peer:PEER,room:name});if(Object.keys(mine).length)await api('POST','/api/room/presence',{peer:PEER,room:name,presence:mine})}catch(e){}},
      async emit(topic,data){try{await api('POST','/api/room/emit',{peer:PEER,room:name,topic,data})}catch(e){const x=new Error(e.message);x.code=e.status===403||e.status===400?'not_permitted':'unavailable';throw x}},
      on(topic,h,errH){(hs[topic]=hs[topic]||[]).push(h);return()=>{hs[topic]=(hs[topic]||[]).filter(x=>x!==h)}},
      async presence(p){Object.entries(p).forEach(([k,v])=>{if(v===null)delete mine[k];else mine[k]=v});room._notify();
        try{await api('POST','/api/room/presence',{peer:PEER,room:name,presence:mine})}catch(e){if(e.status===409){await room._rejoin()}else throw e}},
      onPeers(h,errH){ph.add(h);setTimeout(()=>{try{h({peers:room.peers(),joined:room.peers(),left:[],updated:[]})}catch(e){}},0);return()=>ph.delete(h)},
      connected:()=>connected,onConnection(h){connH.add(h);setTimeout(()=>h(connected),0);return()=>connH.delete(h)},
      async leave(){room._dead=true;if(rooms[name]!==room)return;delete rooms[name];try{await api('POST','/api/room/leave',{peer:PEER,room:name})}catch(e){}}};
    return room;
  }
  async function joinRoom(name){
    if(rooms[name])rooms[name]._dead=true;
    const r=makeRoom(name);rooms[name]=r;
    await api('POST','/api/room/join',{peer:PEER,room:name});return r;
  }
  let lobbyP=null;
  const roomNs=async()=>{if(!lobbyP)lobbyP=joinRoom('lobby').then(l=>{l.join=joinRoom;return l});return lobbyP};

  /* ---------- account ---------- */
  window.chuoAccount={
    async logout(){try{await api('POST','/api/auth/logout',{})}catch(e){}location.reload()},
    async remove(){await api('DELETE','/api/account');location.reload()},
    exportUrl:'/api/account/export'};

  window.claude={use:async name=>{await ready;await streamReady;
    if(name==='user')return userNs;if(name==='db')return dbNs;if(name==='room')return roomNs();return null}};

  /* ---------- boot ---------- */
  (async()=>{
    try{const j=await api('GET','/api/me');if(j.me){signedIn(j.me);return}}catch(e){}
    const go=()=>showLogin();document.body?go():document.addEventListener('DOMContentLoaded',go);
  })();
})();
</script>

function weekEvents(offset){
  const d=addDays(offset),w=d.getDay(),ev=[];
  const T={student:{1:[['08:00','Calculus I lecture']],2:[['10:00','Intro to Programming lab']],3:[['08:00','Calculus I lecture'],['14:00','Entrepreneurship']],4:[['10:00','Intro to Programming lab'],['16:00','CAT revision']],5:[['09:00','Communication Skills']]},
   lecturer:{1:[['10:00','Lecture: Microeconomics']],2:[['15:00','Office hours']],3:[['10:00','Lecture: Microeconomics']],4:[['14:00','Department meeting']],5:[['11:00','Marking time']]},
   staff:{1:[['08:00','Front desk shift']],2:[['08:00','Front desk shift']],3:[['08:00','Front desk shift'],['12:30','Guild call']],4:[['08:00','Front desk shift']],5:[['08:00','Front desk shift']]}}[S.role];
  (T[w]||[]).forEach(e=>ev.push({time:e[0],text:e[1],kind:'class'}));
  lineList().forEach(l=>{if(l.s.toDateString()===d.toDateString()){if(has(S.rsvp,l.id))ev.push({time:hhmm(l.s),text:l.title,kind:'rsvp'});else if(S.overlay)ev.push({time:hhmm(l.s),text:l.title+' ('+l.uni+')',kind:'national'})}});
  S.slots.forEach(s=>{if(s.day===offset)ev.push({time:s.time,text:s.text,kind:'slot'})});
  return ev.sort((a,b)=>a.time.localeCompare(b.time));
}

async function submitCompose(){

function act(a,r,el,ev){
  switch(a){
   case 'tab':go(r);break;
   case 'lang-toggle':S.lang=S.lang==='sw'?'en':'sw';save();render(true);break;
   case 'role-open':S.sheet={type:'role'};renderSheet();break;
   case 'role':S.role=r;save();S.sheet=null;renderSheet();render(true);toast(roleName(r));break;
   case 'sheet-x':S.sheet=null;renderSheet();break;
   case 'sheet-bg':if(ev&&el===ev.target){S.sheet=null;renderSheet()}break;
   case 'banner-x':S.banner=false;save();render(true);break;
   case 'goto':{const[tab,sub]=r.split(':');S.tab=tab;S.hub=null;if(sub)S.spacesTab=sub;S.q='';render();break}
   case 'compose':{const kind=r;S.sheet={type:'compose',kind,space:kind==='post'&&S.role==='student'?'Idea & Project Lab':'General'};renderSheet();break}
   case 'compose-go':submitCompose();break;
   case 'post-now':{const v=($('#draft')||{value:''}).value.trim();if(!v){toast('Write something first');return}S.draft='';const d=$('#draft');if(d)d.value='';createPost({kind:'post',text:v,space:''}).then(refreshFeed);break}
   case 'ff':S.feedFilter=r;render(true);break;
   case 'helpful':toggle(S.helpful,r);refreshFeed();break;
   case 'pin':S.mapSel=S.mapSel===r?null:r;render(true);break;
   case 'rsvp':toggle(S.rsvp,r);render(true);toast(has(S.rsvp,r)?'You are going. Added to your calendar.':'RSVP removed');break;
   case 'st':S.spacesTab=r;S.q='';render(true);break;
   case 'join':toggle(S.joined,r);render(true);toast(has(S.joined,r)?'Joined':'Left');break;
   case 'hub':S.tab='spaces';S.hub=r;S.hubTab='notes';render();break;
   case 'hub-close':S.hub=null;render();break;
   case 'ht':S.hubTab=r;render(true);break;
   case 'team':toggle(S.team,r);render(true);toast(has(S.team,r)?'Request sent to the project lead':'Request withdrawn');break;
   case 'interest':toggle(S.interest,r);render(true);toast(has(S.interest,r)?'Message sent through the platform':'Withdrawn');break;
   case 'meet':{S.match={state:'searching'};render(true);setTimeout(()=>{const pool=PEOPLE.filter(p=>p.u!==myShort());S.match={state:'found',person:pool[Math.floor(Math.random()*pool.length)],ice:ICEBREAKERS[Math.floor(Math.random()*ICEBREAKERS.length)]};if(S.tab==='calls')render(true)},1300);if(S.tab!=='calls')go('calls');break}
   case 'meet-hi':{const p=S.match.person;S.threads.unshift({who:p.n,uni:p.u,when:'Just now',pre:'You said hi. They will see it when live chat opens in Phase 2.'});S.threads=S.threads.slice(0,5);save();S.match={state:'idle'};render(true);toast('Hello sent. Find it in Me, Messages.');break}
   case 'of':S.oppFilter=r;render(true);break;
   case 'save':toggle(S.saved,r);refreshOpps();toast(has(S.saved,r)?'Saved to Me':'Removed');break;
   case 'apply':S.sheet={type:'apply'};renderSheet();break;
   case 'cd':S.calDay=+r;render(true);break;
   case 'overlay':S.overlay=!S.overlay;render(true);break;
   case 'sharett':S.shareTT=!S.shareTT;save();render(true);toast(S.shareTT?'Timetable shared (preview only)':'Timetable private');break;
  }
}

function peerName(p){

function roomSys(txt){roomMsgs.push({k:'sys',text:txt,ts:Date.now()});refreshRoom()}
async function openRoom(spec){
  leaveRoomQuiet();
  S.room=spec;S.tab='calls';S.page=null;roomMsgs=[];roomPeers=[];myHand=false;render();
  if(!roomNs){roomSys('The live room needs a signed-in view of this page. You can still RSVP and use the call link.');return}
  try{
    const r=await roomNs.join(spec.name);
    if(S.room!==spec){r.leave().catch(()=>{});return}
    ROOM=r;
    roomUn=[r.on('chat',onChat,()=>roomSys('The room connection dropped.')),r.onPeers(ch=>{roomPeers=ch.peers;resolveNames().then(refreshRoom);refreshRoom()},()=>{})];
    r.presence({role:S.role,uni:myShort(),nick:meInfo.name||'',hand:null});
    roomPeers=r.peers();refreshRoom();
  }catch(e){roomSys('Could not join the room. Go back and try again.')}
}
function leaveRoomQuiet(){
  roomUn.forEach(u=>{try{u()}catch(e){}});roomUn=[];
  if(ROOM){const r=ROOM;ROOM=null;r.leave().catch(()=>{})}
  S.room=null;roomPeers=[];myHand=false;
}
function onChat(msg){
  const d=msg.data||{};const text=String(d.t==null?'':d.t).slice(0,300);if(!text)return;
  roomMsgs.push({k:d.k==='react'?'react':'msg',by:msg.by,me:msg.isMe,text,role:d.role,uni:d.uni,ts:Date.now()});

    const c=$('#room-count');if(c)c.textContent=ps.length;

async function sendChat(){

function matchCard(){

  if(m.state==='searching')return `<div class="match"><div class="row"><div class="pulse"></div><div><h3 style="font-size:20px">Looking for someone who is here right now…</h3><p class="muted">Takes a few seconds. If nobody else is looking, you will get an example match.</p></div></div><div>${btnAct('meet-cancel','Cancel','btn--ghost')}</div></div>`;
  if(m.state==='found'){const p=m.person;
   return `<div class="match"><span class="eyebrow" style="color:var(--night-dim)">Example match · no one else was looking</span>
    <div class="row">${av(p.n)}<div><h3 style="font-size:22px">${esc(p.n)}</h3><div class="muted">${esc(p.c)}, ${esc(p.u)}</div></div></div>
    <p>Both of you like <b>${esc(p.i)}</b>. A way to start: <i>${esc(m.ice)}</i></p>
    <div class="row row--wrap">${btnAct('meet','Look again')}${btnAct('meet-cancel','Close','btn--ghost')}</div>
    <p class="muted" style="font-size:13px">Real matches happen when two people press "${esc(t('meet'))}" at the same time. Invite a friend and try it together.</p></div>`}
  return `<div class="match"><h2 style="font-size:24px">${esc(t('meet'))}</h2><p class="muted">One tap pairs you with someone who is on the page right now, for a private chat room. Leave any time.</p><div>${btnAct('meet',esc(t('meet')))}</div></div>`;
}
function stopLooking(){
  clearTimeout(meetTimer);if(meetUn){try{meetUn()}catch(e){}meetUn=null}
  if(roomNs)roomNs.presence({looking:null,luni:null,match:null}).catch(()=>{});
}
function checkPair(){
  if(S.match.state!=='searching'||!roomNs)return;
  const ps=roomNs.peers(),me=ps.find(p=>p.sameTab);if(!me)return;
  const now=Date.now();
  const inbound=ps.find(p=>!p.sameTab&&p.kind==='viewer'&&p.presence&&p.presence.match===me.peer&&now-p.updatedAt<20000);
  if(!inbound){
    const cands=ps.filter(p=>!p.sameTab&&p.kind==='viewer'&&p.presence&&p.presence.looking&&now-p.updatedAt<90000).sort((a,b)=>a.peer<b.peer?-1:1);
    const mm=me.presence&&me.presence.match;
    if(mm&&cands.find(p=>p.peer===mm&&(!p.presence.match||p.presence.match===me.peer)))return;
    const c=cands.find(p=>!p.presence.match||p.presence.match===me.peer);
    if(c&&mm!==c.peer)roomNs.presence({match:c.peer}).catch(()=>{});
    return;
  }
  const p=inbound;
  S.match={state:'idle'};
  clearTimeout(meetTimer);if(meetUn){try{meetUn()}catch(e){}meetUn=null}
  if((me.presence&&me.presence.match)!==p.peer)roomNs.presence({match:p.peer}).catch(()=>{});
  setTimeout(()=>roomNs.presence({looking:null,luni:null,match:null}).catch(()=>{}),4000);
  const nm=NAMES[p.by]||'a student';
  openRoom({kind:'pair',name:('pair-'+[p.peer,me.peer].sort().join('-')).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48),title:'Chat with '+nm,sub:(p.presence.luni?p.presence.luni+' · ':'')+'You were matched just now'});
}
function startMeet(){
  stopLooking();S.match={state:'searching'};S.tab='calls';S.page=null;leaveRoomQuiet();render();
  if(roomNs){
    roomNs.presence({looking:Date.now(),luni:myShort()}).catch(()=>{});
    meetUn=roomNs.onPeers(()=>checkPair(),()=>{});setTimeout(checkPair,300);
  }
  meetTimer=setTimeout(()=>{
    stopLooking();if(S.match.state!=='searching')return;
    const pool=PEOPLE.filter(p=>p.u!==myShort());
    S.match={state:'found',person:pool[Math.floor(Math.random()*pool.length)],ice:ICEBREAKERS[Math.floor(Math.random()*ICEBREAKERS.length)]};
    if(S.tab==='calls'&&!S.room)render(true);
  },roomNs?6000:1500);
}

  }

  }

  else if(k==='endorse'){if(need(V('cm-name'),'Add the person\'s name'))return;if(need(txt,'Say what they did well'))return;name='endorse';doc={name:V('cm-name'),forUni:V('cm-uni'),skills:tags,text:txt};after=()=>{S.deskTab='recs';render(true)}}
  S.sheet=null;renderSheet();

function act2(a,r,el,ev){
  switch(a){
   case 'meet':startMeet();return true;
   case 'meet-cancel':stopLooking();S.match={state:'idle'};render(true);return true;
   case 'rsvp':{toggleResp('rsvp',r);toast(isGoing(r)?'You are going. Added to your calendar.':'RSVP removed');return true}
   case 'room':{const l=allLines().find(x=>x.id===r);if(!l)return true;
     openRoom({kind:'line',name:roomSlug(l.id),title:l.title,sub:`${fmtWhen(l.s)} · ${l.dur} min · hosted by ${l.host}, ${l.uni}`,link:l.link,line:l});return true}
   case 'room-leave':leaveRoomQuiet();render();return true;
   case 'hand':myHand=!myHand;if(ROOM)ROOM.presence({hand:myHand?Date.now():null}).catch(()=>{});el.textContent=myHand?'Lower hand':'Raise hand';el.classList.toggle('on',myHand);el.classList.toggle('btn--ghost',!myHand);el.setAttribute('aria-pressed',String(myHand));return true;
   case 'react':if(ROOM&&ROOM.connected())ROOM.emit('chat',{k:'react',t:r,role:S.role,uni:myShort()}).catch(()=>{});else toast('Not connected to the room yet');return true;
   case 'desk-open':S.tab='home';S.page='desk';S.deskTab=r||'lectures';render();return true;
   case 'desk-close':S.page=null;render();return true;
   case 'dt':S.deskTab=r;render(true);return true;
   case 'resp':{const i=r.indexOf(':');const type=r.slice(0,i),id=r.slice(i+1);toggleResp(type,id);toast(isOn(type,id)?'Sent through the platform':'Withdrawn');return true}
   case 'accept':{const[id,by]=r.split(':');patchDoc('lectures',id,{status:'matched',matchedBy:by}).then(()=>{toast('Accepted. Arrange the details in a message or call.');softRender()});return true}
   case 'del':{const i=r.indexOf(':');removeDoc(r.slice(0,i),r.slice(i+1)).then(()=>{toast('Removed');softRender()});return true}
  }
  return false;
}

  return `<section><button class="card card--flat entry" data-act="page-open:guild"><div class="grow"><b>Staff Guild Hub</b><small>${q} open questions · ${m} mentorship posts · ${s} job swaps</small></div><span aria-hidden="true">→</span></button></section>`;
}

/* ---------- Project Lab ---------- */
const EX_PROJ=PROJECTS.map(p=>({id:p.id,title:p.title,tags:p.need.replace(/^Needs:\s*/,'').split(/,\s*/),desc:'',who:'A student lead',uni:p.uni,example:true}));
function projList(){
  const q=S.labQ.trim().toLowerCase();
  return [...all('projects').map(d=>({...d,real:true,who:ownerName(d)})),...EX_PROJ]
    .filter(d=>!q||(d.title+' '+(d.tags||[]).join(' ')+' '+(d.desc||'')).toLowerCase().includes(q));
}
function projCard(d){
  const mine=!d.example&&isMine(d),on=isOn('team',d.id),rs=mine?responders('team',d.id):[],n=responders('team',d.id).length;
  return `<article class="card stack" style="gap:10px"><div class="row row--wrap" style="gap:6px"><span class="badge badge--student">Project</span>${d.example?`<span class="tag">${esc(t('example'))}</span>`:d.local?'<span class="tag">this device</span>':''}</div>
   <h3 style="font-size:18px">${esc(d.title)}</h3>${d.desc?`<p class="muted" style="font-size:14.5px">${esc(d.desc)}</p>`:''}
   ${(d.tags||[]).length?`<div class="pill-row">${d.tags.map(x=>`<span class="badge">Needs: ${esc(x)}</span>`).join('')}</div>`:''}
   <div class="meta"><b>${esc(d.who)}</b>${vBadge(d.by)}<span>${esc(d.uni)}</span>${d.real?`<span>${n} want${n===1?'s':''} to join</span>`:''}</div>
   ${mine?`${rs.length?`<div class="pill-row">${rs.map(r=>`<span class="badge">${esc(NAMES[r.by]||roleName(r.role))}, ${esc(r.uni)} ${vBadge(r.by)}</span>`).join('')}</div>`:'<p class="muted" style="font-size:13.5px">Nobody has asked to join yet.</p>'}<div><button class="btn btn--sm btn--ghost" data-act="del:projects:${esc(d.id)}">Remove</button></div>`
   :`<div><button class="btn btn--sm ${on?'on':''}" data-act="resp:team:${esc(d.id)}" aria-pressed="${on}">${on?'Request sent ✓':'Join team'}</button></div>`}</article>`;
}
const refreshLab=()=>{const el=$('#lab-list');if(el){const l=projList();el.innerHTML=l.length?l.map(projCard).join(''):'<div class="empty">No projects match. Start one.</div>'}};
function labView(){
  return `<button class="back" data-act="page-close">← ${esc(t('back'))}</button><div class="sec-h" style="margin-top:6px"><h1 style="font-size:28px">Project Lab</h1>${btnAct('compose:project','Start a project','btn--sm')}</div>
   <p class="muted" style="margin:0 0 12px">Post an idea, say who you need, and students from other campuses ask to join. Teams are strongest when they mix universities and skills.</p>
   <label class="search" style="margin-bottom:12px"><span aria-hidden="true">⌕</span><input id="lab-q" type="search" placeholder="Search by idea or skill needed…" value="${esc(S.labQ)}" aria-label="Search projects"></label>
   <div class="grid2" id="lab-list">${projList().map(projCard).join('')||'<div class="empty">No projects match. Start one.</div>'}</div>`;
}
function studentBlock(){
  const mine=HUBS.filter(h=>has(S.joined,h.id)),show=mine.length?mine:HUBS.slice(0,4);
  return `<section><div class="sec-h"><h2>${esc(mine.length?t('yourhubs'):t('units'))}</h2><button class="back" data-act="goto:spaces:unit">${esc(t('spaces'))} →</button></div>
   <div class="grid2">${show.slice(0,4).map(h=>`<button class="card card--flat" style="text-align:left" data-act="hub:${h.id}"><b style="font-family:var(--f-display);font-size:17px">${esc(h.name)}</b><div class="meta" style="margin-top:4px"><span>${h.unis} universities</span><span class="mono">${h.members.toLocaleString('en-KE')} members</span></div><p class="muted" style="font-size:13.5px;margin-top:6px">${esc(h.hot)}</p></button>`).join('')}</div></section>
   <section><div class="sec-h"><h2>${esc(t('lab'))}</h2><button class="back" data-act="page-open:lab">Open Project Lab →</button></div><div class="grid2">${projList().slice(0,2).map(projCard).join('')}</div></section>`;
}
function roleBlock(){
  if(S.role==='lecturer')return lecturerBlock();
  if(S.role==='student')return studentBlock();
  return guildEntry()+roleBlockBase();
}

/* ---------- campus map ---------- */
const ACT_KEYS=['lines','lectures','research','slots','qa','mentor','projects'];
function actByUni(){const m={};[...DB.posts,...ACT_KEYS.flatMap(k=>DB[k])].forEach(d=>{if(d.uni)m[d.uni]=(m[d.uni]||0)+1});return m}
const townOf=s=>TOWNS.find(tw=>tw.u.includes(s));
const townAct=(tw,A)=>tw.u.reduce((n,s)=>n+(A[s]||0),0);
function mapSvg(){
  const X=lon=>((lon-33.5)*60).toFixed(1),Y=lat=>((5.1-lat)*60).toFixed(1),A=actByUni();
  const path='M'+KENYA.map(p=>X(p[0])+' '+Y(p[1])).join('L')+'Z';
  const pins=TOWNS.map(tw=>{const sel=S.mapSel===tw.k,n=townAct(tw,A),r=8+tw.u.length*1.4+Math.min(n,8);
    return `<g class="pin${n?' act':''}" role="button" tabindex="0" aria-label="${esc(tw.n)}: ${tw.u.length} universities, ${n} shared items" aria-pressed="${sel}" data-act="pin:${tw.k}"><circle class="halo" cx="${X(tw.lon)}" cy="${Y(tw.lat)}" r="${r}"/><circle class="core" cx="${X(tw.lon)}" cy="${Y(tw.lat)}" r="6"/></g>`}).join('');
  const s=TOWNS.find(x=>x.k===S.mapSel);
  const lab=s?`<text text-anchor="middle" x="${Math.max(80,Math.min(+X(s.lon),430))}" y="${+Y(s.lat)-20}">${esc(s.n)}</text>`:'';
  return `<svg viewBox="0 0 520 600" role="group" aria-label="Schematic map of Kenya with university towns. Red pins have shared activity."><path class="land" d="${path}"/><ellipse class="lake" cx="${X(36.1)}" cy="${Y(3.5)}" rx="9" ry="42"/>${pins}${lab}</svg>`;
}
function uniRow(u,A){
  const tw=townOf(u.s),n=A[u.s]||0;
  return `<div class="line" style="align-items:flex-start"><div class="grow"><b>${esc(u.name)}</b><div class="meta"><span class="badge">${esc(u.s)}</span><span>${tw?esc(tw.n):'Not on the map yet'}</span><span>${n} shared item${n===1?'':'s'}</span></div></div><div class="row row--wrap">${tw?`<button class="btn btn--sm btn--ghost" data-act="mapshow:${tw.k}">On map</button>`:''}<button class="btn btn--sm" data-act="uni-feed:${esc(u.s)}">See posts</button></div></div>`;
}
function mapResults(){
  const A=actByUni(),q=S.mapQ.trim().toLowerCase();
  if(q){const l=UNIS.filter(u=>(u.name+' '+u.s).toLowerCase().includes(q)).slice(0,15);return l.length?l.map(u=>uniRow(u,A)).join(''):`<div class="empty">No university matches "${esc(S.mapQ)}".</div>`}
  const tw=TOWNS.find(x=>x.k===S.mapSel);
  if(tw)return `<div class="sec-h" style="margin:0 0 6px"><h3 style="font-size:17px">${esc(tw.n)}</h3><button class="back" data-act="mapshow:">Clear</button></div>`+tw.u.map(s=>UNIS.find(u=>u.s===s)).filter(Boolean).map(u=>uniRow(u,A)).join('');
  const top=UNIS.filter(u=>A[u.s]).sort((a,b)=>A[b.s]-A[a.s]).slice(0,8);
  return top.length?`<div class="sec-h" style="margin:0 0 6px"><h3 style="font-size:17px">Most active campuses</h3></div>`+top.map(u=>uniRow(u,A)).join(''):`<p class="muted" style="font-size:14px">Nothing has been shared yet, so no campus is lit up. Search for a university, or tap a town on the map. Pins turn red when people there post, host an Open Line or start a project.</p>`;
}
const refreshMapRes=()=>{const el=$('#map-res');if(el)el.innerHTML=mapResults()};
function mapPanel(){
  const s=TOWNS.find(x=>x.k===S.mapSel),A=actByUni();
  const btn=`<div style="margin-top:12px"><button class="btn btn--sm btn--ghost" data-act="page-open:map">Open the full campus map →</button></div>`;
  if(!s)return `<p class="muted" style="font-size:13.5px">Tap a town to see the universities there. Bigger circles mean more universities. Red means people there have shared something.</p>${btn}`;
  const full=s.u.map(sn=>UNIS.find(u=>u.s===sn)).filter(Boolean);
  return `<div><h3 style="font-size:17px">${esc(s.n)}</h3><div class="row row--wrap" style="gap:6px;margin-top:8px">${full.map(u=>`<span class="badge">${esc(u.name)}${A[u.s]?` · ${A[u.s]}`:''}</span>`).join('')}</div></div>${btn}`;
}
function mapPageView(){
  const A=actByUni(),placed=new Set(TOWNS.flatMap(x=>x.u)),unplaced=UNIS.filter(u=>!placed.has(u.s)),total=Object.values(A).reduce((a,b)=>a+b,0);
  return `<button class="back" data-act="page-close">← ${esc(t('back'))}</button><div class="sec-h" style="margin-top:6px"><h1 style="font-size:28px">Campus map</h1></div>
   <div class="statrow" style="margin-bottom:14px"><div class="stat"><b>${UNIS.length}</b><span>chartered universities</span></div><div class="stat"><b>${placed.size}</b><span>placed on the map</span></div><div class="stat"><b>${total}</b><span>shared items from campuses</span></div></div>
   <div class="cols"><aside class="cols__side"><section class="card map map--full">${mapSvg()}</section></aside>
   <div class="cols__main"><section class="card stack"><label class="search"><span aria-hidden="true">⌕</span><input id="map-q" type="search" placeholder="Find a university…" value="${esc(S.mapQ)}" aria-label="Find a university"></label><div id="map-res">${mapResults()}</div></section>
   ${unplaced.length?`<section class="card stack"><h3 style="font-size:17px">Not on the map yet (${unplaced.length})</h3><p class="muted" style="font-size:13.5px">These campuses are in the list and in search, but their town has no pin yet.</p><div class="pill-row">${unplaced.map(u=>`<button class="badge" style="border:0;cursor:pointer" data-act="uni-feed:${esc(u.s)}">${esc(u.name)}</button>`).join('')}</div></section>`:''}</div></div>`;
}

/* ---------- Spaces: entry cards ---------- */
function spacesView(){
  const h=spacesViewBase();if(S.hub)return h;
  const e=(a,ttl,sub)=>`<button class="card card--flat entry" data-act="${a}"><div class="grow"><b>${ttl}</b><small>${sub}</small></div><span aria-hidden="true">→</span></button>`;
  const i=h.indexOf('</div>')+6;
  return h.slice(0,i)+`<div class="grid2" style="margin-bottom:14px">${e('page-open:guild','Staff Guild Hub','Help desk, mentorship and job swaps')}${e('page-open:lab','Project Lab','Find teammates from other campuses')}</div>`+h.slice(i);
}
function pageView(){
  if(S.room&&S.tab==='calls')return roomView();
  if(S.tab==='home'&&S.page==='desk')return deskView();
  if(S.page==='guild')return guildView();
  if(S.page==='lab')return labView();
  if(S.page==='map')return mapPageView();
  return {home:homeView,spaces:spacesView,calls:callsView,opps:oppsView,me:meView}[S.tab]();
}

/* ---------- compose sheets ---------- */
const NEW_T={qa:'Ask the guild',answer:'Write an answer',mentor:'Post about mentorship',project:'Start a project'};
function guildSelHtml(id){return `<label class="field">Guild<select id="${id}">${GUILD_NAMES.map(n=>`<option ${n===(S.guildSel||'')?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`}
function sheetHtml(){
  const sh=S.sheet;if(!sh)return '';
  if(sh.type==='claim')return wrapSheet('Ask a moderator to confirm your role',claimBody());
  if(sh.type==='compose'&&NEWK.includes(sh.kind)){
    const k=sh.kind;
    const f={qa:`${guildSelHtml('cm-guild')}<label class="field">Your question<input id="cm-title" maxlength="140" placeholder="e.g. How do you handle supplementary exam timetables?"></label>`,
      answer:'',
      mentor:`<label class="field">I want to<select id="cm-type"><option value="offer">Offer mentorship</option><option value="seek">Find a mentor</option></select></label>${guildSelHtml('cm-guild')}<label class="field">Topic<input id="cm-title" maxlength="120" placeholder="e.g. Moving from clerk to registry officer"></label>`,
      project:`<label class="field">Project name<input id="cm-title" maxlength="100" placeholder="e.g. Offline revision app"></label><label class="field">Who do you need? Separate with commas<input id="cm-tags" maxlength="100" placeholder="Designer, Android dev"></label>`}[k];
    const lab={qa:'More detail (optional)',answer:'Your answer',mentor:'More detail',project:'What are you building and why?'}[k];
    const body=`${f}<label class="field">${lab}<textarea id="cm-text" maxlength="600" placeholder="Write it clearly and kindly"></textarea></label><div id="cm-err" style="color:var(--live);font-size:13.5px" role="alert"></div><div class="row row--wrap">${btnAct('compose-go','Publish')}${btnAct('sheet-x','Cancel','btn--ghost')}</div><p class="muted" style="font-size:12.5px">Shared with other viewers of this page. Be kind; moderators can remove content.</p>`;
    return wrapSheet(NEW_T[k],body);
  }
  let h=sheetHtmlBase();
  if(sh.type==='compose'&&sh.pre)h=h.replace(`<option >${sh.pre}</option>`,`<option selected>${sh.pre}</option>`);
  return h;
}
async function submitCompose(){
  const k=S.sheet&&S.sheet.kind;
  if(!NEWK.includes(k))return submitComposeBase();
  const V=id=>{const e=$('#'+id);return e?e.value.trim():''},err=m=>{const e=$('#cm-err');if(e)e.textContent=m};
  const txt=V('cm-text'),tags=V('cm-tags').split(',').map(s=>s.trim()).filter(Boolean).slice(0,5);
  if(k==='answer'){
    if(!txt){err('Write your answer first');return}
    const target=S.sheet.target;S.sheet=null;renderSheet();
    const doc={type:'answer',target,text:txt,role:S.role,uni:myShort(),ts:Date.now()};
    if(dbReady()){try{doc.by=meInfo.id;await dbc.collection('resp').doc(`answer__${target}__${meInfo.id}`).set(doc);S.qaOpen[target]=true;toast('Answer shared');softRender();return}catch(e){}}
    S.loc.answers=S.loc.answers||[];S.loc.answers=S.loc.answers.filter(a=>a.target!==target);S.loc.answers.push({...doc,id:'la'+doc.ts,local:true});save();S.qaOpen[target]=true;
    toast('Saved on this device. Sign in with edit access to share with others.');render(true);return;
  }
  let name,doc,after;
  if(k==='qa'){if(!V('cm-title')){err('Write your question');return}name='qa';doc={q:V('cm-title'),desc:txt,guild:V('cm-guild'),status:'open'};after=()=>{S.page='guild';S.guildTab='help';render(true)}}
  else if(k==='mentor'){if(!V('cm-title')){err('Add a topic');return}name='mentor';doc={type:V('cm-type'),title:V('cm-title'),guild:V('cm-guild'),desc:txt};after=()=>{S.page='guild';S.guildTab='mentor';render(true)}}
  else{if(!V('cm-title')){err('Give the project a name');return}name='projects';doc={title:V('cm-title'),tags,desc:txt};after=()=>{S.page='lab';S.tab='spaces';render(true)}}
  S.sheet=null;renderSheet();await createDoc(name,doc);after();
}

/* ---------- actions ---------- */
function act3(a,r,el,ev){
  switch(a){
   case 'goto':S.page=null;return false;
   case 'ff':if(r==='uni'){S.feedFilter='all';render(true);return true}return false;
   case 'page-open':{S.page=r;S.hub=null;S.tab=r==='map'?'home':'spaces';if(r==='guild'&&!S.guildTab)S.guildTab='help';render();return true}
   case 'page-close':S.page=null;render();return true;
   case 'gt':S.guildTab=r;render(true);return true;
   case 'swap-new':S.sheet={type:'compose',kind:'opp',pre:'Job swap'};renderSheet();return true;
   case 'compose':if(NEWK.includes(r)){S.sheet={type:'compose',kind:r};renderSheet();return true}return false;
   case 'answer':S.sheet={type:'compose',kind:'answer',target:r};renderSheet();return true;
   case 'qa-toggle':S.qaOpen[r]=!S.qaOpen[r];render(true);return true;
   case 'solve':patchDoc('qa',r,{status:'solved'}).then(()=>{toast('Marked solved');softRender()});return true;
   case 'acct-logout':window.chuoAccount&&window.chuoAccount.logout();return true;
   case 'acct-delete-ask':S.delAsk=true;render(true);return true;
   case 'acct-delete-no':S.delAsk=false;render(true);return true;
   case 'acct-delete':window.chuoAccount&&window.chuoAccount.remove();return true;
   case 'claim-open':S.sheet={type:'claim'};renderSheet();return true;
   case 'claim-go':submitClaim();return true;
   case 'claim-withdraw':dropDoc('claims',meInfo.id,'Claim withdrawn').then(()=>{MYCLAIM=null;softRender()});return true;
   case 'vapprove':approveClaim(r);return true;
   case 'vreject':dropDoc('claims',r,'Claim rejected');return true;
   case 'vrevoke':dropDoc('verified',r,'Badge removed');return true;
   case 'mapshow':S.mapSel=r||null;S.mapQ='';render(true);return true;
   case 'uni-feed':S.feedFilter='uni';S.feedUni=r;S.page=null;S.tab='home';render();return true;
  }
  return false;
}
document.addEventListener('input',e=>{
  if(e.target.id==='lab-q'){S.labQ=e.target.value;refreshLab()}
  if(e.target.id==='map-q'){S.mapQ=e.target.value;refreshMapRes()}
});
document.addEventListener('change',e=>{if(e.target.id==='guild-sel'){S.guildSel=e.target.value;render(true)}});

/* ---------- capabilities ---------- */
async function initCaps(){
  try{
    if(!(window.claude&&claude.use))return;
    userNs=await claude.use('user');
    if(userNs){const m=await userNs.me();meInfo={id:m.id,name:m.name||'',avatarUrl:m.avatarUrl||'',emailUni:m.uniShort||''};if(meInfo.emailUni){const uu=UNIS.find(x=>x.s===meInfo.emailUni);if(uu&&S.uni!==uu.name){S.uni=uu.name;save()}}try{canWrite=(await userNs.can('data.write'))!==false}catch(e){canWrite=true}try{isAdmin=!!(await userNs.canEdit())}catch(e){isAdmin=false}render(true)}
    dbc=await claude.use('db');
    if(dbc){
      ['posts','lines','lectures','research','slots','endorse','qa','mentor','projects'].forEach(n=>watch(n,150));watch('resp',500);watch('verified',500);
      if(isAdmin)watch('claims',200);
      else if(meInfo.id){try{dbc.collection('claims').doc(meInfo.id).onSnapshot(s=>{MYCLAIM=s&&s.exists?{id:s.id,...s.data()}:null;softRender()},()=>{})}catch(e){}}
    }
  }catch(e){}
  try{roomNs=window.claude&&claude.use?await claude.use('room'):null}catch(e){roomNs=null}
}
render();initCaps();
</script>
